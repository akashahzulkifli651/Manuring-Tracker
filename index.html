const ID=[["2024A (imm)","1",70.05,10227,[["COMP65","Jan",1.5,1],["BOR","Apr",.1,1],["COMP65","Apr",1.5,1],["KIES","Apr",.5,1],["COMP65","Jul",1.5,2],["RP","Aug",2,2]]],

const FN={AC:"Ammonium chloride (AC)",MOP:"Muriate of potash (MOP)",BOR:"Borate",GML:"Ground magnesium limestone (GML)",RP:"Rock phosphate (RP)",COMP65:"Compound 65",KIES:"Kieserite"};

const SAFE=s=>s.replace(/[^A-Za-z0-9_.~:@+-]/g,"_");
const rows=[],byDid={};
MD.split("\n").forEach(l=>{const [b,s,ha,p,r]=l.split("|");const pl=+p;
 const a=[];r.split(",").forEach((v,i)=>{v=+v;if(v>0)a.push({f:MR[i][0],rd:MR[i][1],h:MR[i][2],rate:v,t:v*pl/1000})});
 rows.push({id:b+"/"+s,did:SAFE(b+"/"+s),blk:b,sub:s,ha:+ha,pl,ty:"M",a})});
ID.forEach(x=>rows.push({id:x[0]+"/"+x[1],did:SAFE(x[0]+"/"+x[1]),blk:x[0],sub:x[1],ha:x[2],pl:x[3],ty:"I",a:x[4].map(y=>({f:y[0],rd:y[1],h:y[3],rate:y[2],t:y[2]*x[3]/1000}))}));
rows.forEach(r=>byDid[r.did]=r);

/* state */
let prog={},trips=[],tab="o",open={},names={},asked={};
let db=null,userCap=null,uid="",mode="loading",canWrite=true,isAdmin=true,live=false,stale=false,note="",armed="",armReset=false,pending=false,dismissed=false;
const iso=()=>new Date().toISOString();
const dstr=t=>{try{return new Date(t).toLocaleDateString(undefined,{day:"numeric",month:"short"})}catch(e){return""}};
const f1=n=>n.toLocaleString(undefined,{maximumFractionDigits:1});
const f2=n=>n.toLocaleString(undefined,{maximumFractionDigits:2});
const dn=k=>{const [d,i]=k.split("#");return(prog[d]&&prog[d].a&&prog[d].a[i])||0};
const flt=()=>document.getElementById("flt").value;
const cur=()=>rows.filter(r=>!flt()||r.ty===flt());
const apps=rs=>rs.flatMap(r=>r.a.map((a,i)=>({...a,r,k:r.did+"#"+i})));
const stat=l=>{const T=l.reduce((s,a)=>s+a.t,0),D=l.reduce((s,a)=>s+dn(a.k)*a.t,0);return{T,D,p:T?D/T*100:0,n:l.length,nd:l.filter(a=>dn(a.k)>=.999).length}};
const bar=(p,c)=>`<div class="bar"><i style="width:${Math.min(100,p)}%;${c?"--c:"+c:""}"></i></div>`;
const got=(f,h)=>trips.filter(t=>t.f===f&&t.h===h).reduce((s,t)=>s+t.mt,0);
const ro=()=>!canWrite;
const dis=()=>canWrite?"":"disabled";
const who=id=>!id?"":id===uid?"You":(names[id]||"");

/* local fallback + legacy import */
function legacy(){let d={},r={};try{d=JSON.parse(localStorage.getItem("mt26")||"{}")}catch(e){}try{r=JSON.parse(localStorage.getItem("mr26")||"{}")}catch(e){}
 const p={};Object.keys(d).forEach(k=>{const [rid,i]=k.split("#"),dd=SAFE(rid),v=Math.min(1,+d[k]||0);if(byDid[dd]&&v>0)(p[dd]=p[dd]||{a:{}}).a[i]=v});
 const t=[];Object.keys(r).forEach(k=>{const [f,h]=k.split("|");(r[k]||[]).forEach(x=>{if(x&&x.mt>0)t.push({f,h:+h,mt:+x.mt})})});
 return{p,t}}
function loadLocal(){let p=null,t=null;try{p=JSON.parse(localStorage.getItem("mtp26")||"null");t=JSON.parse(localStorage.getItem("mtt26")||"null")}catch(e){}
 if(!p&&!t){const L=legacy();p=L.p;t=L.t.map((x,i)=>({id:"t"+i,f:x.f,h:x.h,mt:x.mt,ts:iso(),by:""}))}
 prog=p||{};trips=t||[]}
function saveLocal(){try{localStorage.setItem("mtp26",JSON.stringify(prog));localStorage.setItem("mtt26",JSON.stringify(trips))}catch(e){}}

/* writes */
const qs={};
function queue(path,fn){const p=(qs[path]||Promise.resolve()).catch(()=>{}).then(fn);qs[path]=p;return p}
function werr(e){if(e&&e.code==="invalid_argument"){canWrite=false;note="You can view this page but not edit it."}else if(e&&e.code==="quota_exceeded"){note="Storage is full. Ask the page owner to clear space."}else note="Couldn't save that change. Try again.";render();setTimeout(()=>{note="";render()},5000)}
function writeRow(d,a){const empty=!Object.keys(a).length;
 if(empty)delete prog[d];else prog[d]={a,by:uid,at:iso()};
 if(mode==="shared"){const p="progress/"+d;queue(p,()=>empty?db.doc(p).delete():db.doc(p).set({a,by:uid,at:iso()})).catch(werr)}else saveLocal()}
function setMany(pairs){const by={};pairs.forEach(([k,v])=>{const [d,i]=k.split("#");if(!by[d])by[d]={...((prog[d]&&prog[d].a)||{})};if(v>0)by[d][i]=Math.min(1,v);else delete by[d][i]});
 Object.keys(by).forEach(d=>writeRow(d,by[d]));render()}
function addTrip(f,h,mt){const t={f,h,mt,ts:iso(),by:uid};
 if(mode==="shared"){const ref=db.collection("trips").doc();t.id=ref.id;trips.push(t);render();queue("trips/"+t.id,()=>ref.set({f,h,mt,ts:t.ts,by:uid})).catch(werr)}
 else{t.id="t"+Date.now();trips.push(t);saveLocal();render()}}
function editTrip(id,mt){const t=trips.find(x=>x.id===id);if(!t)return;t.mt=mt;
 if(mode==="shared")queue("trips/"+id,()=>db.doc("trips/"+id).update({mt})).catch(werr);else saveLocal();render()}
function delTrip(id){trips=trips.filter(x=>x.id!==id);
 if(mode==="shared")queue("trips/"+id,()=>db.doc("trips/"+id).delete()).catch(werr);else saveLocal();render()}
function resetAll(){const ds=Object.keys(prog);prog={};
 if(mode==="shared")ds.forEach(d=>queue("progress/"+d,()=>db.doc("progress/"+d).delete()).catch(werr));else saveLocal();render()}
async function importLegacy(){const L=legacy();dismissed=true;note="Importing…";render();
 try{for(const d of Object.keys(L.p)){await db.doc("progress/"+d).set({a:L.p[d].a,by:uid,at:iso()})}
  for(const x of L.t){await db.collection("trips").doc().set({f:x.f,h:x.h,mt:x.mt,ts:iso(),by:uid})}
  note="Imported from this device."}catch(e){werr(e);return}
 render();setTimeout(()=>{note="";render()},4000)}
function legacyCount(){const L=legacy();return Object.keys(L.p).length+L.t.length}

/* names of people who edited */
async function needNames(){if(!userCap||!userCap.profiles)return;

/* views */
function fertList(A,detail){return Object.keys(FN).filter(f=>A.some(a=>a.f===f)).map(f=>{const L=A.filter(a=>a.f===f),s=stat(L);

 return `<div class="card"><div class="row"><b>${FN[f]}</b><b>${f1(s.p)}%</b></div>${detail?bar(s.p,FC[f]):""}<div class="mut">${f1(s.D)} / ${f1(s.T)} mt · ${s.nd}/${s.n} applications</div>${ex}${rc(f,detail,detail?null:A)}</div>`}).join("")}
function rc(f,det,A){const all=(A||apps(rows)).filter(a=>a.f===f);
 return [1,2].map(h=>{const L=all.filter(a=>a.h===h);if(!L.length)return"";const s=stat(L),g=got(f,h),k=f+"|"+h,pc=s.T?Math.min(100,g/s.T*100):0,bal=g-s.D,nm=h===1?"1st half":"2nd half";
  if(!det)return `<div class="row mut" style="margin-top:8px"><span>${nm}</span><span>${f1(s.p)}% · ${f1(s.D)} / ${f1(s.T)} mt</span></div>${bar(s.p,FC[f])}<div class="mut">Received ${f2(g)} / ${f1(s.T)} mt</div>`;
  const tl=trips.filter(t=>t.f===f&&t.h===h).sort((a,b)=>(a.ts||"")<(b.ts||"")?-1:1);
  const tr=tl.map((x,i)=>{const w=who(x.by);return `<div class="row" style="margin-top:4px"><span class="mut">Trip ${i+1}${x.ts?" · "+dstr(x.ts):""}${w?" · "+w:""}</span><span><input type="number" step="any" min="0" value="${x.mt}" data-e="${x.id}" aria-label="Trip ${i+1} mt" ${dis()}> mt <button class="x ${armed===x.id?"arm":""}" data-x="${x.id}" ${dis()}>${armed===x.id?"Delete?":"Delete"}</button></span></div>`}).join("");
  return `<div class="sb"><div class="row"><b>${nm}</b><span class="mut">Received ${f2(g)} / ${f1(s.T)} mt (${f1(pc)}%)</span></div>${bar(pc,FC[f])}<div class="mut">Applied ${f1(s.D)} mt · In store <b class="${bal<0?"neg":""}">${f2(bal)} mt</b>${bal<0?" (applied exceeds received)":""}</div>${tr}<div class="row" style="margin-top:6px"><input type="number" step="any" min="0" placeholder="New trip mt" id="n-${k}" aria-label="New trip mt" ${dis()}><button class="chip" data-a="${k}" ${dis()}>+ Add trip</button></div></div>`}).join("")}
function stockView(){const A=apps(rows);
 const cards=Object.keys(FN).filter(f=>A.some(a=>a.f===f)).map(f=>{const L=A.filter(a=>a.f===f),s=stat(L),g=got(f,1)+got(f,2),st=g-s.D,rem=s.T-s.D,net=st-rem;
  const hv=[1,2].map(h=>{const l=L.filter(a=>a.h===h);if(!l.length)return"";const q=stat(l),gg=got(f,h);return `<tr><td>${h===1?"1st half":"2nd half"}</td><td>${f2(gg)}</td><td>${f2(q.D)}</td><td>${f2(gg-q.D)}</td></tr>`}).join("");
  return `<div class="card"><div class="row"><b>${FN[f]}</b><span class="big ${st<0?"neg":""}" style="${st<0?"":"color:var(--ac)"}">${f2(st)} mt</span></div><div class="mut">Stock = received ${f2(g)} − applied ${f2(s.D)} mt</div><div class="tw"><table><tr><th></th><th>Received</th><th>Applied</th><th>Stock</th></tr>${hv}</table></div><div class="mut" style="margin-top:6px">Still to apply ${f2(rem)} mt · ${net>=0?"surplus after program":"still to receive"} <b>${f2(Math.abs(net))} mt</b></div></div>`}).join("");
 return `<div class="mut" style="margin-bottom:8px">Stock covers all fields. Add received trips in the Fertiliser tab; applied mt comes from the Fields tab.</div>`+cards}
function fieldsView(rs){let h="";const g={};rs.forEach(r=>(g[r.blk]=g[r.blk]||[]).push(r));
 Object.keys(g).forEach(b=>{const R=g[b],L=apps(R),s=stat(L),ha=R.reduce((x,r)=>x+r.ha,0);
  const combos=[...new Set(L.map(a=>a.f+"|"+a.rd))];
  h+=`<details data-b="${b}" ${open[b]?"open":""}><summary><div class="row"><b>${b}</b><span><span class="tag">${ha.toFixed(1)} ha</span> <b>${f1(s.p)}%</b></span></div>${bar(s.p)}<div class="mut">${f1(s.D)} / ${f1(s.T)} mt</div></summary>`;
  h+=combos.map(c=>{const [f,rd]=c.split("|"),q=stat(L.filter(a=>a.f===f&&a.rd===rd));return `<div class="row mut" style="margin-top:8px"><span>${f} · ${rd}</span><span>${f1(q.p)}% · ${f1(q.D)}/${f1(q.T)} mt</span></div>`+bar(q.p,FC[f])}).join("");
  h+=`<div class="chips">`+combos.map(c=>{const [f,rd]=c.split("|"),m=L.filter(a=>a.f===f&&a.rd===rd),on=m.every(a=>dn(a.k)>=.999);return `<button class="chip all ${on?"on":""}" data-g="${b}|${c}" ${dis()}>All ${f} ${rd}</button>`}).join("")+`</div>`;
  R.forEach(r=>{const pr=prog[r.did],w=pr&&pr.at?`Updated ${dstr(pr.at)}${who(pr.by)?" by "+who(pr.by):""}`:"";
   h+=`<div class="sb"><div class="row"><b>Block ${r.sub}</b><span class="mut">${r.ha} ha · ${r.pl.toLocaleString()} palms</span></div>${w?`<div class="mut">${w}</div>`:""}`+
   r.a.map((a,i)=>{const k=r.did+"#"+i,fr=Math.min(1,dn(k)),full=fr>=.999;return `<div class="ar"><div class="row"><span>${a.f} · ${a.rd}</span><span class="mut">${a.rate} kg/palm · plan ${f2(a.t)} mt</span></div><div class="row" style="margin-top:4px"><span><input type="number" step="any" min="0" value="${fr?+(fr*a.t).toFixed(2):""}" placeholder="0" data-p="${k}" data-pt="${a.t}" aria-label="${a.f} ${a.rd} applied mt, block ${b} ${r.sub}" ${dis()}> mt <span class="mut">(${f1(fr*100)}%)</span></span><button class="chip ${full?"on":""}" data-k="${k}" ${dis()}>Full</button></div>${bar(fr*100,FC[a.f])}</div>`}).join("")+`</div>`});
  h+=`</details>`});return h}
function render(){
 document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));
 const rs=cur(),A=apps(rs);document.getElementById("flt").style.display=tab==="s"?"none":"";let h="";
 if(tab==="o"){const all=stat(A),a1=stat(A.filter(a=>a.h===1)),a2=stat(A.filter(a=>a.h===2));
  h+=`<div class="card"><div class="mut">Overall program</div><div class="big">${f1(all.p)}%</div>${bar(all.p)}<div class="mut">${f1(all.D)} of ${f1(all.T)} mt applied · ${rs.reduce((s,r)=>s+r.ha,0).toFixed(0)} ha</div></div>`;
  h+=`<div class="grid">`+[[a1,"1st half","Jan–Jun","var(--h1)"],[a2,"2nd half","Jul–Oct","var(--h2)"]].map(([s,n,m,c])=>`<div class="card"><div class="mut">${n} · ${m}</div><div class="big">${f1(s.p)}%</div>${bar(s.p,c)}<div class="mut">${f1(s.D)} / ${f1(s.T)} mt</div></div>`).join("")+`</div><h3>By fertiliser</h3>`+fertList(A)}
 if(tab==="z")h+=fertList(A,true);
 if(tab==="s")h+=stockView();
 if(tab==="f")h+=fieldsView(rs);
 document.getElementById("v").innerHTML=h;
 /* status */
 let st="";
 if(note)st=note;
 else if(mode==="local")st="Saved on this device only. Shared editing isn't available here.";
 else if(mode==="loading")st="Connecting…";
 else if(stale)st="Can't reach shared data yet. Figures may be out of date.";
 else if(!canWrite)st="<b>View only</b> · you can see progress but not edit it.";
 else st="<b>Shared</b> · everyone with the link sees changes live.";
 const s=document.getElementById("st");s.innerHTML=st;s.className="st"+(stale?" warn":"");
 /* import banner */
 let bn="";
 if(mode==="shared"&&live&&canWrite&&!dismissed&&!Object.keys(prog).length&&!trips.length&&legacyCount())bn=`<div class="bn"><span>This device has progress saved from the earlier version.</span><span><button class="chip" id="imp">Import it</button> <button class="chip" id="skip">Skip</button></span></div>`;
 document.getElementById("bn").innerHTML=bn;
 /* footer */
 document.getElementById("ft").innerHTML=(isAdmin&&(mode==="local"||canWrite)&&(Object.keys(prog).length))?`<button class="reset ${armReset?"arm":""}" id="rs">${armReset?"Tap again to clear all application progress for everyone":"Reset all application progress"}</button>`:"";
}
function refresh(){const a=document.activeElement;if(a&&a.tagName==="INPUT"&&document.getElementById("v").contains(a)){pending=true;return}render()}

/* events */
document.addEventListener("change",e=>{const d=e.target.dataset;if(!d)return;
 if(d.p){const v=parseFloat(e.target.value),t=+d.pt;setMany([[d.p,v>0?Math.min(1,v/t):0]]);return}
 if(d.e){const v=parseFloat(e.target.value);if(!(v>=0)){render();return}editTrip(d.e,v)}});
document.addEventListener("focusout",()=>{if(pending)setTimeout(()=>{const a=document.activeElement;if(pending&&!(a&&a.tagName==="INPUT")){pending=false;render()}},200)});
document.addEventListener("click",e=>{const t=e.target;
 const ad=t.closest("[data-a]");if(ad){const k=ad.dataset.a,el=document.getElementById("n-"+k),v=parseFloat(el.value);if(!(v>0))return;const [f,h]=k.split("|");addTrip(f,+h,v);return}
 const dx=t.closest("[data-x]");if(dx){const id=dx.dataset.x;if(armed===id){armed="";delTrip(id)}else{armed=id;render();setTimeout(()=>{if(armed===id){armed="";render()}},4000)}return}
 const tb=t.closest(".tabs [data-t]");if(tb){tab=tb.dataset.t;render();return}
 const k=t.closest("[data-k]");if(k){const x=k.dataset.k;setMany([[x,dn(x)>=.999?0:1]]);return}
 const g=t.closest("[data-g]");if(g){const [b,f,rd]=g.dataset.g.split("|");const m=apps(rows.filter(r=>r.blk===b)).filter(a=>a.f===f&&a.rd===rd);const all=m.every(a=>dn(a.k)>=.999);setMany(m.map(a=>[a.k,all?0:1]));return}
 if(t.id==="imp"){importLegacy();return}
 if(t.id==="skip"){dismissed=true;render();return}
 if(t.id==="rs"){if(armReset){armReset=false;resetAll()}else{armReset=true;render();setTimeout(()=>{if(armReset){armReset=false;render()}},4000)}}});
document.addEventListener("toggle",e=>{if(e.target.dataset&&e.target.dataset.b)open[e.target.dataset.b]=e.target.open},true);
document.getElementById("flt").onchange=render;

/* boot */
render();
(async function(){
 const c=window.claude;
 try{db=c&&c.use?await c.use("db"):null}catch(e){db=null}
 try{userCap=c&&c.use?await c.use("user"):null}catch(e){userCap=null}
 if(userCap){
  try{uid=(await userCap.id())||""}catch(e){}
  try{canWrite=(await userCap.can("data.write"))!==false}catch(e){}
  try{isAdmin=!!(await userCap.canEdit())}catch(e){}
 }
 if(!db){mode="local";isAdmin=true;loadLocal();render();return}
 mode="shared";render();
 const tm=setTimeout(()=>{if(!live){stale=true;render()}},10000);
 const onFirst=s=>{if(!s.metadata.fromCache){live=true;stale=false;clearTimeout(tm)}};
 const onErr=e=>{clearTimeout(tm);if(e&&e.code==="revoked"){canWrite=false}else stale=true;refresh()};
 db.collection("progress").onSnapshot(s=>{const p={};s.docs.forEach(d=>{p[d.id]=d.data()});prog=p;onFirst(s);refresh();needNames()},onErr);
 db.collection("trips").orderBy("ts").onSnapshot(s=>{trips=s.docs.map(d=>({id:d.id,...d.data()}));onFirst(s);refresh();needNames()},onErr);
})();
</script>

</body></html>
